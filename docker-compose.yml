# Base PostgreSQL locale pour le développement.  npm run db:up  /  npm run db:down
# (NON TESTÉ dans l'environnement de création : voir docs/DECISIONS.md.)
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mira}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mira}
      POSTGRES_DB: ${POSTGRES_DB:-mira}
    ports:
      - "5432:5432"
    volumes:
      - mira_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mira} -d ${POSTGRES_DB:-mira}"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  mira_pgdata:
